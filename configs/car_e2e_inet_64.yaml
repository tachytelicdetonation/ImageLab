task: e2e
# Fork B on combined ImageNette (easy) + ImageWoof (hard) @ 64px -- 20 classes, ~26k images.
#
# WHY this dataset: Pokemon was 1 image per unique name, so the AR could only memorize p(image),
# never learn p(image|text) -> identical, prompt-agnostic generations. Here each class has ~1350
# images, so "church"/"golden retriever"/"samoyed" are repeating, visually-grounded concepts the
# AR can actually condition on. The combined set gives a built-in easy-vs-hard axis (distinct
# objects vs near-identical dog breeds) from ONE model -- eval splits the grids by the manifest's
# `dataset` tag. This is an initial 1-epoch smoke test.
#
# Same Fork B stack as car_e2e_pokemon_64_bar.yaml: channel-wise binary FSQ + masked-bit (MBM) head.

data:
  root: data_inet
  size: 64
  hflip: true
  augment: false

model:
  latent_channels: 256
  codebook_size: 16384
  commitment_beta: 0.25           # unused by FSQ
  quant_type: fsq
  fsq_bits: 14                    # binary FSQ: |C|=16384, k=14 bits/channel
  enc_ch: 128
  enc_ch_mult: [1, 2, 4]          # 64 -> 16 (f=4); grid 16x16, token_dim=256
  decoder_ch: 128
  decoder_ch_mult: [1, 2, 4]
  decoder_res_blocks: 2
  qwen_name: Qwen/Qwen3-0.6B
  freeze_backbone: false
  attn_impl: sdpa
  head_type: mbm
  mbm_depth: 2
  mbm_infer_steps: 4
  dino_name: facebook/dinov2-large
  max_text_len: 16
  # Per-dataset prompt groups -> separate gen grids in wandb (generations/imagenette vs
  # generations/imagewoof), plus separate recon + AR metrics (eval/imagenette/*,
  # eval/imagewoof/*, eval/combined/*). Easy-vs-hard from one model, at a glance.
  sample_prompts_by_dataset:
    imagenette:
      - a photo of a tench
      - a photo of a church
      - a photo of a golf ball
      - a photo of a parachute
      - a photo of a garbage truck
    imagewoof:
      - a photo of a beagle
      - a photo of a samoyed
      - a photo of a golden retriever
      - a photo of a dingo
      - a photo of a shih-tzu
  sample_prompts: [a photo of a church, a photo of a beagle]   # fallback (unused when by_dataset set)
  temperature: 1.0
  top_k: 0
  cfg_scale: 3.0                  # conditioning now real (token_acc 0.86) -> CFG amplifies signal, not noise

loss:
  recon_loss_type: l2
  perceptual_weight: 1.0
  codebook_weight: 1.0
  disc_weight: 1.0
  disc_loss: hinge
  lpips_net: vgg
  gan_eta: 0.05

train:
  device: cuda
  amp: bf16
  batch_size: 40                  # A100-40GB: bs32 AR-on safe (~12-30GB); bs64 OOM'd at AR-start (>39GB
                                  # peak: first AR backward spikes w/ 642M grads+Adam+recompute). 40 = safe max.
  grad_accum: 1
  epochs: 8                       # multi-epoch: test undertraining hypothesis for free-running gen
  lr: 1.0e-4
  car_lr: 5.0e-5
  beta1: 0.5
  beta2: 0.9
  weight_decay: 1.0e-4
  warmup_steps: 100
  grad_clip: 1.0
  disc_start_step: 150
  ar_start_step: 0                # EOSTok trains AR jointly FROM SCRATCH (L_VQVAE + L_NTP together);
                                  # the old delay was an IBQ-era "let the codebook settle" hack that
                                  # FSQ doesn't need (no learned codebook to collapse). 0 = faithful
                                  # AND uses all ~411 single-epoch steps for AR. (BAR, by contrast,
                                  # is two-stage: AR only on a frozen tokenizer.)
  cond_dropout_prob: 0.1          # enables CFG at sampling (now that conditioning is learnable)
  lambda_ntp: 1.0
  lambda_apr: 0.0                 # no soft-codebook APR for the bit head
  apr_lpips_weight: 0.0
  lambda_sem: 0.0                 # DINO off to isolate FSQ+MBM
  nested_dropout_prob: 0.25
  channel_weight_schedule: uniform
  channel_weight_alpha: 1.0
  log_every: 25
  sample_every: 100               # more gen snapshots through the 8-epoch (~5264-step) run
  ckpt_every: 1000
  num_workers: 8
  seed: 0

wandb:
  enabled: true
  project: cvq-pokemon
  entity: null
  name: e2e-barfsq-inet20-1ep
  mode: online

out:
  ckpt_dir: checkpoints_e2e_inet
  sample_dir: samples_e2e_inet
