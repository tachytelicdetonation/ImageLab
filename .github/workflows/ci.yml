name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (locked, CPU torch)
        # The lockfile pins everything; torch alone is swapped for the CPU build so CI
        # doesn't download multi-GB CUDA wheels. All later steps use --no-sync so uv
        # doesn't "repair" the venv back to the locked (CUDA-capable) torch.
        run: |
          uv sync --locked --no-install-package torch --no-install-package torchvision
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: uv run --no-sync ruff check imagelab examples tests
      - name: Seam tests (no network, no datasets)
        run: uv run --no-sync pytest -q
      - name: Scaffold cannot rot (lab new -> smoke run, as written)
        run: |
          uv run --no-sync python -m imagelab.lab new task ci_scratch_task
          uv run --no-sync python -m imagelab.trainer --config ci_scratch_task/config.yaml --tier smoke
      - name: Example tasks resolve and pass contract probes
        run: |
          uv run --no-sync python -m imagelab.lab check task examples/ddpm/task.py:DDPMTask
          uv run --no-sync python -m imagelab.lab check task examples/rectified_flow/task.py:RectifiedFlowTask
