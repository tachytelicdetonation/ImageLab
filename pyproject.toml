[project]
name = "imagelab"
version = "0.4.0"
description = "A small lab for single-GPU model experimentation: bring your own model/data/loss/metrics, get tiered runs (smoke/overfit/fast/full) and a filesystem ledger that makes results comparable"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # torch from PyPI: CUDA-bundled wheels on Linux, MPS-capable wheels on arm64 macOS.
    "torch>=2.4.1",
    "torchvision>=0.19.1",
    "pillow>=10.0.0",
    "numpy>=1.26",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Experiment-tracking mirrors; the filesystem ledger works without them.
logging = ["wandb>=0.17.0", "tensorboard>=2.16.0"]

[project.scripts]
lab = "imagelab.lab.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

# Modules the trainer/`lab` import before resolving registry names — how an installed
# project's tasks, components, checkers, and scaffolds get registered. Point this at
# your own packages in YOUR pyproject.toml; file-path tasks (task: task.py:Class)
# need no registration at all.
[tool.imagelab]
imports = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imagelab"]
